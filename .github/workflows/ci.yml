name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test Data Warehouse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync

      - name: Install dbt Packages
        run: |
          uv run dbt deps --project-dir dbt --profiles-dir dbt

      - name: Execute Full Warehouse ETL & ML Pipeline Build
        run: |
          uv run python -m etl.extract
          uv run python -m etl.transform
          uv run python -m etl.load
          uv run dbt build --project-dir dbt --profiles-dir dbt --exclude mart_revenue_analytics
          uv run python -m ml.train
          uv run python -m ml.score
          uv run dbt build --project-dir dbt --profiles-dir dbt --select mart_revenue_analytics

      - name: Run Test Suite
        run: |
          uv run pytest -v
